<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kids Shorts Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">▶</span><div><h1>Kids Shorts Studio</h1><p><span id="styleCount">52</span> cartoon styles · random never-repeating videos · Shorts &amp; Videos · YouTube autopilot</p></div></div>
    <div class="top-actions"><a class="nav" href="autopilot.html">YouTube Autopilot →</a><div id="serverBadge" class="badge">checking server…</div></div>
  </header>

  <main class="layout">
    <section class="panel styles">
      <h2>Styles</h2>
      <input id="styleSearch" class="search" placeholder="Search 52 styles…">
      <div id="styleGrid" class="style-grid"></div>
    </section>

    <section class="panel stage">
      <div class="stage-head">
        <div>
          <h2 id="styleName">—</h2>
          <p id="styleDesc" class="muted"></p>
          <p id="variantInfo" class="variant"></p>
        </div>
        <div class="seg" id="formatSeg">
          <button data-v="short" class="on">Short 9:16</button>
          <button data-v="video">Video 16:9</button>
        </div>
      </div>
      <div class="player-wrap" id="playerWrap"><canvas id="player"></canvas></div>
      <div class="controls">
        <button id="playBtn" class="round" aria-label="Play">▶</button>
        <input id="scrub" type="range" min="0" max="1000" value="0">
        <span id="timeLbl" class="mono">0.0 / 0.0s</span>
      </div>
      <div id="sceneStrip" class="scene-strip"></div>
      <div class="random-row">
        <button id="randomBtn" class="primary slim">🎲 Random new lesson</button>
        <label class="inline"><input type="checkbox" id="optLessons" checked> learning lessons only</label>
        <span class="spacer"></span>
        <label class="inline">Variation # <input id="optSeed" type="number" min="0" value="0" class="seed"></label>
        <button id="diceBtn" class="ghost slim" title="New variation of this style">Shuffle</button>
        <button id="classicBtn" class="ghost slim">Classic</button>
      </div>
    </section>

    <section class="panel side">
      <h2>Customize</h2>
      <label>Teacher<input id="optName" value="Leo" maxlength="20" readonly title="Leo teaches in every video"></label>
      <label>Channel name<input id="optChannel" value="EarlyLearnersWorld" maxlength="30"></label>
      <div class="field"><span>Skin tone</span><div class="swatches" id="skinSw"></div></div>
      <div class="field row"><label class="inline"><input type="checkbox" id="optOutfitAuto" checked> Style outfit</label><input type="color" id="optOutfit" value="#ffe34f" disabled></div>
      <div class="toggles">
        <label class="inline"><input type="checkbox" id="optCaptions" checked> Captions</label>
        <label class="inline"><input type="checkbox" id="optNarration" checked> Narration</label>
        <label class="inline"><input type="checkbox" id="optOutro" checked> Subscribe outro</label>
        <label class="inline"><input type="checkbox" id="optWatermark" checked> Watermark</label>
      </div>
      <div class="field row">
        <label>Resolution<select id="optRes"><option value="1080" selected>1080p</option><option value="720">720p</option></select></label>
        <label>FPS<select id="optFps"><option>24</option><option selected>30</option></select></label>
      </div>
      <label>Narrator voice<select id="optVoice"><option value="en-US-AnaNeural">Ana — child (natural)</option></select></label>

      <h2 class="mt">Export</h2>
      <button id="exportBtn" class="primary">Export this style</button>
      <button id="exportAllBtn" class="ghost">Export all (shorts + videos)</button>
      <div id="progress" class="progress hidden"><div class="bar"><i></i></div><span></span></div>

      <h2 class="mt">Rendered files</h2>
      <div id="outputs" class="outputs"><p class="muted">Nothing yet.</p></div>
    </section>
  </main>

  <div id="batchOverlay" class="overlay hidden"><div><h2>Batch rendering…</h2><p id="batchMsg"></p></div></div>

  <script src="js/engine.js"></script>
  <script src="js/props.js"></script>
  <script src="js/render.js"></script>
  <script src="js/styles.js"></script>
  <script src="js/styles2.js"></script>
  <script src="js/styles3.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
